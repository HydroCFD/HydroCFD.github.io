<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instrument verification</title>
<style>
body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
       max-width: 980px; margin: 30px auto; padding: 0 20px; color: #1c1c1c; }
h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 26px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; border-bottom: 1px solid #ddd; padding: 5px; color: #666; }
td { padding: 4px 5px; border-bottom: 1px solid #f2f2f2; font-variant-numeric: tabular-nums; }
.ok { color: #2e7d4f; font-weight: 600; }
.bad { color: #b2453c; font-weight: 600; }
#summary { padding: 12px 14px; border-radius: 6px; font-weight: 600; margin: 18px 0; }
.pass { background: #eaf5ee; border: 1px solid #b9dcc6; color: #2e7d4f; }
.fail { background: #fbeceb; border: 1px solid #edc4c0; color: #b2453c; }
code { background: #f4f4f0; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Verification: the browser against the Python reference</h1>
<p>Every number below is produced twice, once by <code>reference.py</code> and
once by <code>js/instrument.js</code> running here. They must agree to four
decimals. A difference is a build failure, not a rounding detail.</p>
<div id="summary">running…</div>
<div id="out"></div>

<script src="../data/bundle_b64.js"></script>
<script src="expected.js"></script>
<script src="../js/linalg.js"></script>
<script src="../js/bundle.js"></script>
<script src="../js/instrument.js"></script>
<script>
(function () {
  var TOL = 1e-4, fails = 0, checks = 0;
  var b = Bundle.load(), inst = new Instrument(b), E = window.EXPECTED;
  var out = document.getElementById("out");

  function tbl(title, rows) {
    var h = document.createElement("h2"); h.textContent = title;
    out.appendChild(h);
    var t = document.createElement("table");
    t.innerHTML = "<tr><th>quantity</th><th>python</th><th>browser</th>"
      + "<th>difference</th><th></th></tr>";
    rows.forEach(function (r) {
      checks++;
      var d = Math.abs(r[1] - r[2]), ok = d <= TOL * Math.max(1, Math.abs(r[1]));
      if (!ok) fails++;
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + r[0] + "</td><td>" + fmt(r[1]) + "</td><td>"
        + fmt(r[2]) + "</td><td>" + d.toExponential(1) + "</td><td class='"
        + (ok ? "ok'>pass" : "bad'>FAIL") + "</td>";
      t.appendChild(tr);
    });
    out.appendChild(t);
  }
  function fmt(v) {
    return Math.abs(v) >= 1e4 || (v !== 0 && Math.abs(v) < 1e-3)
      ? v.toExponential(4) : v.toFixed(6);
  }

  function corrCov(truth, month, f) {
    var nW = inst.nWet, base = month * nW, i, n = nW,
      sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, cov = 0, t;
    for (i = 0; i < n; i++) {
      t = truth[base + i];
      sx += t; sy += f.mean[i]; sxx += t * t; syy += f.mean[i] * f.mean[i];
      sxy += t * f.mean[i];
      if (Math.abs(t - f.mean[i]) <= f.sd[i] + 1e-9) cov++;
    }
    return [(n * sxy - sx * sy) / Math.sqrt((n * sxx - sx * sx)
      * (n * syy - sy * sy)), cov / n];
  }

  ["fate", "frg", "bio"].forEach(function (fam) {
    var c = E.cases[fam], rows = [], i;
    var post = inst.update(c.stations.length ? rowsOf(c) : [], c.y,
      { cv: 0.5, offset: false });
    var w = inst.weights(post);
    var f = inst.field(post, c.months[1]);
    var truth = b.a["demo_" + fam + "_truth"];
    var cc = corrCov(truth, c.months[1], f);
    var sumM = 0, sumS = 0;
    for (i = 0; i < f.mean.length; i++) {
      sumM += Math.abs(f.mean[i]); sumS += Math.abs(f.sd[i]);
    }
    rows.push(["field correlation", c.corr, cc[0]]);
    rows.push(["one sigma coverage", c.coverage, cc[1]]);
    rows.push(["sum of |reconstruction|", c.field_checksum, sumM]);
    rows.push(["sum of |standard deviation|", c.sd_checksum, sumS]);
    for (i = 0; i < 3; i++)
      rows.push(["evidence weight " + inst.fams[i], c.weights[i], w[i]]);
    var camp = inst.campaign(rowsOf(c), c.y, { cv: 0.5, offset: false });
    var lead = 0;
    for (i = 1; i < 3; i++) if (w[i] > w[lead]) lead = i;
    var ps = inst.parameterSummary(camp, inst.fams[lead]);
    Object.keys(c.params).forEach(function (k) {
      if (!ps[k]) { rows.push(["parameter " + k + " median", c.params[k][2], NaN]); return; }
      rows.push(["parameter " + k + " median", c.params[k][2], ps[k].q[2]]);
    });
    var placed = c.stations.slice();
    var nx = inst.nextStation(post, c.months, placed, 0.5);
    rows.push(["next station cell", c.next_station[0], nx.best.station]);
    rows.push(["next station month", c.next_station[1], nx.best.month]);
    rows.push(["next station gain", c.next_gain, nx.gain]);
    rows.push(["surprise", c.surprise, inst.surprise(rowsOf(c), c.y, 0.5, false)]);
    tbl(fam.toUpperCase() + "  (" + c.case + ")", rows);
  });

  function rowsOf(c) {
    var r = [], m, i;
    for (m = 0; m < c.months.length; m++)
      for (i = 0; i < c.stations.length; i++)
        r.push(inst.rowOf(c.stations[i], c.months[m]));
    return r;
  }

  var o = E.offset_case,
    postO = inst.update(rowsOf(o), o.y, { cv: 0.5, offset: true }),
    fO = inst.field(postO, o.months[1]),
    ccO = corrCov(b.a.demo_fate_truth, o.months[1], fO);
  tbl("Unknown scale: the offset coefficient", [
    ["estimated offset", o.offset, inst.offsetEstimate(postO)],
    ["field correlation", o.corr, ccO[0]]
  ]);

  var cz = E.censor_case,
    postC = inst.update(rowsOf(cz), cz.y, {
      cv: 0.5, offset: false, censored: cz.censored, limit: cz.limit
    }),
    fC = inst.field(postC, cz.months[1]),
    ccC = corrCov(b.a.demo_fate_truth, cz.months[1], fC);
  tbl("Detection limit: the censored likelihood", [
    ["field correlation", cz.corr, ccC[0]]
  ]);

  var s = document.getElementById("summary");
  s.className = fails ? "fail" : "pass";
  s.textContent = fails
    ? fails + " of " + checks + " checks FAILED"
    : "All " + checks + " checks pass. The browser reproduces the Python "
      + "reference to four decimals.";
})();
</script>
</body>
</html>
